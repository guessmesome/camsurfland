<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f4f3">
  <title>CamSurf · Вход в аналитику</title>
  <style>
    :root { color-scheme: light; --bg: #f5f4f3; --ink: #17181d; --muted: #6c7387; --line: #e3e7f4; --pink: #e64148; --cyan: #4ec4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.5; }
    button, input { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    h1, p { margin: 0; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; width: 100%; max-width: 1264px; margin: 0 auto; padding: 32px 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 24px; font-weight: 750; letter-spacing: -.055em; line-height: 1; }
    .brand span { color: var(--pink); }
    .brand b { color: #e64148; font-weight: inherit; }
    .access { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border: 1px solid #dce2f3; border-radius: 999px; color: #56617b; font-size: 12px; font-weight: 550; white-space: nowrap; }
    .access svg { flex: 0 0 auto; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 48px 0 72px; }
    .card { width: 100%; max-width: 416px; padding: 32px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 10px 32px #384b8210; }
    .eyebrow { margin-bottom: 9px; color: #ce343b; font-size: 12px; font-weight: 650; }
    h1 { font-size: 28px; line-height: 1.2; font-weight: 720; letter-spacing: -.045em; }
    .subtitle { margin-top: 10px; color: var(--muted); font-size: 13px; }
    form { display: flex; flex-direction: column; gap: 18px; margin-top: 26px; }
    .field { display: flex; flex-direction: column; gap: 7px; color: #525c73; font-size: 12px; font-weight: 600; }
    input { width: 100%; min-width: 0; height: 48px; padding: 0 13px; border: 1px solid #dce1ee; border-radius: 10px; color: var(--ink); background: #fff; font-size: 16px; font-weight: 450; }
    input::placeholder { color: #969dad; opacity: 1; }
    .form-error { padding: 11px 13px; border: 1px solid #f2ccd6; border-radius: 10px; color: #9e3151; background: #fff5f7; font-size: 13px; overflow-wrap: anywhere; }
    .submit { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 2px; padding: 12px 16px; border: 0; border-radius: 10px; color: #fff; background: var(--pink); font-size: 15px; font-weight: 650; }
    .help { margin-top: 20px; color: #8b94ab; font-size: 11px; text-align: center; }
    @media (hover: hover) and (pointer: fine) { .submit:hover { background: #cf3038; } }
    @media (max-width: 640px) { .shell { padding: max(21px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); } .brand { font-size: 22px; } .access { gap: 5px; padding: 6px 8px; font-size: 10px; } main { padding: 38px 0; } .card { padding: 27px 24px; border-radius: 16px; } h1 { font-size: 26px; } }
    @media (max-height: 640px) { main { align-items: flex-start; padding: 28px 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="CamSurf"><span>CamSurf</span></div>
      <span class="access"><svg aria-hidden="true" viewBox="0 0 20 20"><rect x="4" y="8.5" width="12" height="8.5" rx="2"/><path d="M6.5 8.5V6a3.5 3.5 0 0 1 7 0v2.5M10 12v2"/></svg>Закрытый доступ</span>
    </header>
    <main>
      <section class="card" aria-labelledby="login-title">
        <p class="eyebrow">Аналитика лендинга</p>
        <h1 id="login-title">Вход в аналитику</h1>
        <p class="subtitle">Введите логин и пароль, чтобы открыть отчёты.</p>
        <form id="login-form" method="post" action="/analytics?action=login">
          <label class="field" for="username">Логин<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="256" required aria-describedby="login-error"></label>
          <label class="field" for="password">Пароль<input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required aria-describedby="login-error"></label>
          <p class="form-error" id="login-error" role="alert" {{ERROR_HIDDEN}}>{{LOGIN_ERROR}}</p>
          <button class="submit" type="submit">Войти</button>
        </form>
        <p class="help">Доступ только для администратора</p>
      </section>
    </main>
  </div>
</body>
</html>
